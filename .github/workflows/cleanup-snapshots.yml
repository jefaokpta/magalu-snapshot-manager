name: Limpar Snapshots

on:
  schedule:
    # 4h00 BRT (UTC-3) == 7h00 UTC
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apagar snapshots com mais de 7 dias
        run: node src/cleanup-snapshots.js
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}

      - name: Registrar execução (keepalive para workflow nao ser desativado depois de 60 sem iteracao no repo)
        if: always()
        run: |
          mkdir -p logs
          echo "- $(date -u '+%Y-%m-%d %H:%M:%S') UTC - limpeza executada" >> logs/execucoes.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/execucoes.log
          git commit -m "chore: execução da limpeza $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:${{ github.ref_name }}